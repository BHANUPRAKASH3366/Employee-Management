<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VCT Employee Portal</title>
  <link rel="icon" href="assets/vct-icon.png">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="shell">
    <aside class="sidebar" id="sidebar">
      <div class="brand">
        <img src="assets/vct-logo.png" alt="VConnecTech Systems">
      </div>
      <nav class="nav" id="nav">
        <a href="#/dashboard" data-route="dashboard"><span class="ico">◧</span>Dashboard</a>
        <a href="#/sectors" data-route="sectors"><span class="ico">▦</span>Sectors</a>
        <a href="#/domains" data-route="domains"><span class="ico">◈</span>Domains</a>
        <a href="#/hierarchy" data-route="hierarchy"><span class="ico">⌬</span>Reporting Hierarchy</a>
        <a href="#/kpi" data-route="kpi"><span class="ico">◎</span>KPI Framework</a>
      </nav>
      <div class="sidebar-foot" id="sourceInfo"></div>
    </aside>

    <div class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" aria-label="Menu">☰</button>
        <img class="hdr-logo" src="assets/vct-logo.png" alt="VConnecTech Systems">
        <button class="back-btn" id="backBtn" hidden title="Go back (Alt + ←)" aria-label="Back"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <div class="topbar-title">
          <h1 id="pageTitle">Dashboard</h1>
          <div class="crumbs" id="crumbs"></div>
        </div>
        <div class="topbar-right">
          <span class="verify-badge" id="verifyBadge" title="Portal numbers compared with the Excel workbook"></span>
          <a href="#/changes" class="bell" id="alertsBtn" title="Alerts — edits to the Excel file" aria-label="Alerts">
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 22a2.5 2.5 0 0 0 2.45-2h-4.9A2.5 2.5 0 0 0 12 22Zm7-6V11a7 7 0 0 0-5.5-6.84V3.5a1.5 1.5 0 0 0-3 0v.66A7 7 0 0 0 5 11v5l-2 2v1h18v-1l-2-2Z"/></svg>
            <span class="bell-badge" id="alertsBadge" hidden>0</span>
          </a>
        </div>
      </header>

      <section class="filters" id="filters">
        <div class="f-item f-search">
          <input type="search" id="fQ" placeholder="Search name, ID, designation…" autocomplete="off">
        </div>
        <div class="f-item"><label for="fSector">Sector</label><select id="fSector"></select></div>
        <div class="f-item"><label for="fProject">Project</label><select id="fProject"></select></div>
        <div class="f-item"><label for="fDomain">Domain</label><select id="fDomain"></select></div>
        <div class="f-item"><label for="fLevel">Level</label><select id="fLevel"></select></div>
        <div class="f-item"><label for="fBilling">Billing</label><select id="fBilling"></select></div>
        <button class="btn-ghost" id="fReset">Reset</button>
        <div class="chips" id="fChips"></div>
      </section>

      <main class="content" id="view" tabindex="-1"></main>
    </div>
  </div>

  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"></aside>
  <div class="tooltip" id="tooltip"></div>

  <script src="vendor/chart.umd.min.js"></script>
  <script src="data/vct-data.js"></script>
  <script src="js/metrics.js"></script>
  <script src="js/data-source.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
